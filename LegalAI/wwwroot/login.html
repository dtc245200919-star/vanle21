<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>LegalAI - Đăng nhập</title><style>body{font-family:Arial;background:#eef3f8;display:grid;place-items:center;height:100vh}.box{background:#fff;padding:30px;border-radius:14px;width:350px;box-shadow:0 8px 30px #0002}input,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{background:#173b73;color:#fff;border:0;border-radius:6px;cursor:pointer}.hint{font-size:13px;color:#667}</style></head><body><div class="box"><h1>LegalAI</h1><p>Đăng nhập hệ thống</p><input id="u" placeholder="Tên đăng nhập"><input id="p" type="password" placeholder="Mật khẩu"><button onclick="login()">Đăng nhập</button><div id="msg"></div><hr><div class="hint">Demo Admin: admin / admin123<br>Demo Nhân viên: nhanvien / nv123</div></div><script>async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location='/index.html';else msg.innerHTML='<p style="color:red">Sai tài khoản hoặc mật khẩu.</p>'}</script></body></html>
